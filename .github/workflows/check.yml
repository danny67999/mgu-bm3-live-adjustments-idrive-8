name: Check source release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - run: python3 tools/build_store_tree.py
      - run: git diff --exit-code -- store mgu-repo.json
